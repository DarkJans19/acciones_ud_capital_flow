[project]
name = "acciones-ud-capital-flow"
version = "0.1.0"
description = "Backend de Acciones UD con FastAPI y arquitectura hexagonal."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiosmtplib>=3.0,<5.0",
    "alembic>=1.14,<2.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.29,<1.0",
    "cryptography>=50.0.2",
    "email-validator>=2.3.0",
    "fastapi>=0.115,<1.0",
    "httpx>=0.28.1",
    "pycountry>=26.2.16",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt>=2.15.1",
    "pyotp>=2.10.0",
    "sqlalchemy[asyncio]>=2.0,<3.0",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.32,<1.0",
    "websockets>=17.4",
]

[dependency-groups]
dev = [
    "asgi-lifespan>=2.1.0",
    "hypothesis>=6.170.15",
    "mypy>=1.13,<2.0",
    "pytest>=8.3,<9.0",
    "pytest-asyncio>=0.24,<1.0",
    "ruff>=0.8,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acciones_ud"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["db: requires disposable PostgreSQL via TEST_DATABASE_URL"]
addopts = "-ra"
cache_dir = ".cache/pytest"

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
